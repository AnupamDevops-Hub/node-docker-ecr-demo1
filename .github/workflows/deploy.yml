name: Deploy Node.js App to EC2 - QA Environment

on:
  push:
    branches:
      - qa
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ecr-demo-repository1

jobs:
  build-and-deploy-qa:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS and ECR configuration
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "ECR Repository: $ECR_REPOSITORY"
          aws sts get-caller-identity
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:qa-latest" \
            .

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:qa-latest"

      - name: Deploy to QA EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.QA_EC2_HOST_QA || secrets.EC2_HOST }}
          username: ${{ secrets.QA_EC2_USERNAME_QA || secrets.EC2_USERNAME }}
          key: ${{ secrets.QA_EC2_SSH_KEY_QA || secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            set -e

            echo "================================"
            echo "Starting QA deployment"
            echo "================================"
            echo "AWS Region: $AWS_REGION"
            echo "EC2 Availability Zone: eu-north-1a"
            echo "ECR Repository: $ECR_REPOSITORY"
            echo "Image Tag: $IMAGE_TAG"

            command -v aws >/dev/null 2>&1 || {
              echo "ERROR: AWS CLI is not installed on EC2."
              exit 1
            }

            command -v docker >/dev/null 2>&1 || {
              echo "ERROR: Docker is not installed on EC2."
              exit 1
            }

            echo "Logging in to ECR..."
            aws ecr get-login-password --region "$AWS_REGION" |
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "Pulling image..."
            docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Stopping old container..."
            docker stop qa-node-app || true

            echo "Removing old container..."
            docker rm qa-node-app || true

            echo "Starting new QA container..."
            docker run -d \
              --name qa-node-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -e ENV=QA \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Waiting for application..."
            sleep 10

            if ! docker ps --format '{{.Names}}' | grep -q '^qa-node-app$'; then
              echo "ERROR: QA container is not running."
              docker logs --tail 100 qa-node-app || true
              exit 1
            fi

            echo "Container is running."
            docker logs --tail 50 qa-node-app || true

            echo "Checking application..."
            curl --fail --silent --show-error --max-time 10 http://localhost:3000

            echo "================================"
            echo "QA Deployment Successful"
            echo "================================"
