name: Deploy Node.js App to docker-demo1 EC2 (QA)

on:
  push:
    branches:
      - qa

env:
  AWS_REGION: eu-north-1 # Base region for eu-north-1a
  ECR_REPOSITORY: docker-demo1

jobs:
  build-and-deploy-qa:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uses credentials from ecr-user-readonly
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:qa-latest" \
            .

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:qa-latest"

      # Deploys to ecr-demo-docker instance
      - name: Deploy to docker-demo1
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.QA_EC2_HOST_QA }}
          username: ${{ secrets.QA_EC2_USERNAME_QA }}
          key: ${{ secrets.QA_EC2_SSH_KEY_QA }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            set -e

            echo "=========================================="
            echo "Starting QA deployment to docker-demo1"
            echo "=========================================="

            echo "Logging in to ECR..."
            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            echo "Pulling new Docker image..."
            docker pull \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Stopping old container..."
            docker stop qa-node-app || true

            echo "Removing old container..."
            docker rm qa-node-app || true

            echo "Starting new QA container..."
            docker run -d \
              --name qa-node-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -e ENV=QA \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Checking container status..."
            docker ps | grep qa-node-app

            echo "=========================================="
            echo "QA Deployment successful"
            echo "=========================================="
